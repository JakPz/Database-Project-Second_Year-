<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>FAMS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;600&display=swap">
<style>
/* Layout: navy sidebar + top bar with global search and user menu; content on a light grey ground. Palette from the supplied mockup: navy #0B3D91, blue #1E88E5, green #42A05C, grey #F4F6F8, ink #212529. Poppins throughout. */
:root{
  --font:'Poppins','Noto Sans Thai',system-ui,-apple-system,'Segoe UI',sans-serif;
  --bg:#F4F6F8; --surface:#ffffff; --surface-2:#f6f8fb; --ink:#212529; --muted:#667085; --line:#e3e8ef;
  --side:#0B3D91; --side-ink:#dbe6fb; --side-hover:#164aa6; --side-active:#1E88E5; --side-dim:#9db7ea;
  --primary:#1976d2; --on-primary:#ffffff; --blue:#1E88E5; --blue-soft:#e3f0fd;
  --green:#42A05C; --green-ink:#2b7d44; --green-btn:#2f8a4b; --on-green:#ffffff; --green-soft:#e1f2e6;
  --late:#a85f00; --late-bg:#fdecc8; --bad:#c62828; --bad-bg:#fbe0dd; --amber:#f2a516; --red:#e0453a;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1623; --surface:#152033; --surface-2:#1a273b; --ink:#e7edf5; --muted:#98a6b8; --line:#26364f;
  --side:#091d45; --side-ink:#d3e0f7; --side-hover:#12306a; --side-active:#1E88E5; --side-dim:#7f98c6;
  --primary:#4aa3f0; --on-primary:#07203d; --blue:#4aa3f0; --blue-soft:#16314f;
  --green:#4cb86a; --green-ink:#6fd68e; --green-btn:#5ccb7d; --on-green:#062a14; --green-soft:#183a26;
  --late:#f0b64d; --late-bg:#3a2f14; --bad:#ff8a80; --bad-bg:#3e1f1c; --amber:#f2b84b; --red:#ef6f63;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1623; --surface:#152033; --surface-2:#1a273b; --ink:#e7edf5; --muted:#98a6b8; --line:#26364f;
  --side:#091d45; --side-ink:#d3e0f7; --side-hover:#12306a; --side-active:#1E88E5; --side-dim:#7f98c6;
  --primary:#4aa3f0; --on-primary:#07203d; --blue:#4aa3f0; --blue-soft:#16314f;
  --green:#4cb86a; --green-ink:#6fd68e; --green-btn:#5ccb7d; --on-green:#062a14; --green-soft:#183a26;
  --late:#f0b64d; --late-bg:#3a2f14; --bad:#ff8a80; --bad-bg:#3e1f1c; --amber:#f2b84b; --red:#ef6f63;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- login ---------- */
.login{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);min-height:100vh}
.hero{background:linear-gradient(135deg,#0B3D91 0%,#0b5a9b 58%,#2f8a4b 130%);color:#fff;padding:48px clamp(20px,5vw,64px);display:flex;flex-direction:column;justify-content:center;gap:18px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto -80px -120px auto;width:420px;height:420px;border-radius:50%;border:2px solid rgba(255,255,255,.16);box-shadow:0 0 0 60px rgba(255,255,255,.04)}
.hero .logo{width:88px;height:88px}
.hero h1{font-size:clamp(40px,6vw,60px);line-height:1;font-weight:700;letter-spacing:.02em}
.hero p{margin:0;font-size:18px;max-width:22ch;line-height:1.35;opacity:.92}
.hero .tag{margin-top:18px;font-weight:600;font-size:16px;line-height:1.5;opacity:.95}
.lform{display:flex;align-items:center;justify-content:center;padding:32px clamp(16px,4vw,48px);background:var(--bg)}
.lcard{width:min(400px,100%);display:grid;gap:14px}
.lcard h2{font-size:26px}
.lcard .sub{margin:-8px 0 4px;color:var(--muted)}
.lrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px}
.demo{margin-top:6px;padding-top:14px;border-top:1px solid var(--line);display:grid;gap:8px}
.demo small{color:var(--muted)}
.demo div{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 12px;gap:16px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;color:#fff}
.brand svg{width:32px;height:32px;flex:none}
.brand b{font-size:22px;font-weight:700;letter-spacing:.05em}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;gap:12px;background:none;border:0;border-radius:8px;padding:10px 12px;color:var(--side-ink);cursor:pointer;text-align:left;font-weight:500}
.nav button:hover{background:var(--side-hover)}
.nav button[aria-current="page"]{background:var(--side-active);color:#fff}
.side .note{margin-top:auto;font-size:12px;line-height:1.5;color:var(--side-dim);padding:10px 8px 0;border-top:1px solid var(--side-hover)}
.content{min-width:0;display:flex;flex-direction:column}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px clamp(16px,3vw,32px);background:var(--surface);border-bottom:1px solid var(--line)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:0 12px;flex:0 1 360px;min-width:0;color:var(--muted)}
.search input{border:0;background:none;padding:8px 0;width:100%;min-width:0;outline:none;color:var(--ink)}
.user{position:relative}
.ubtn{display:flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;padding:4px 6px;border-radius:10px;text-align:left}
.ubtn:hover{background:var(--surface-2)}
.av{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;font-weight:600;font-size:13px;flex:none}
.av.lg{width:64px;height:64px;font-size:22px}
.av.green{background:var(--green)}
.un{display:flex;flex-direction:column;line-height:1.2}
.un b{font-size:13px;font-weight:600}.un small{color:var(--muted);font-size:12px}
.menu{position:absolute;right:0;top:calc(100% + 6px);min-width:180px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;z-index:20}
.menu button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-radius:7px;padding:8px 10px;cursor:pointer;text-align:left}
.menu button:hover{background:var(--surface-2)}
.main{padding:24px clamp(16px,3vw,32px) 56px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px 16px;flex-wrap:wrap;margin-bottom:20px}
.top h1{font-size:clamp(22px,3.2vw,28px);line-height:1.2}
.top p{margin:2px 0 0;color:var(--muted)}
.today{color:var(--muted);font-size:13px;padding-top:6px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--primary);color:var(--on-primary);border:1px solid var(--primary);border-radius:8px;padding:8px 16px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.green{background:var(--green-btn);border-color:var(--green-btn);color:var(--on-green)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface-2);filter:none}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:4px 12px;font-size:13px;border-radius:7px}
.btn.block{width:100%;padding:10px 16px}
.link{background:none;border:0;padding:2px 4px;color:var(--primary);font-weight:600;cursor:pointer}
.link:hover{text-decoration:underline}
.ib{display:inline-grid;place-items:center;width:32px;height:32px;background:none;border:0;border-radius:8px;color:var(--muted);cursor:pointer;font-size:18px;line-height:1}
.ib:hover{background:var(--surface-2);color:var(--ink)}
.ib.view{color:var(--blue)}.ib.edit{color:var(--green-ink)}.ib.del{color:var(--red)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.toolbar input,.toolbar select,.f input,.f select,.f textarea,.remark,.stsel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.toolbar input{flex:1 1 240px;max-width:380px}
.toolbar label{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}

/* ---------- panels & tables ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0;box-shadow:var(--shadow)}
.panel>h2,.panelhead h2{font-size:16px;margin-bottom:10px}
.panelhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.panelhead h2{margin:0}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.grid3{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.stack16{display:grid;gap:16px;margin-bottom:16px}
.empty{color:var(--muted);padding:12px 2px;margin:0}
.tablewrap{overflow-x:auto}
.panel .tablewrap{margin:0 -4px}
.tw{border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;min-width:520px}
th{font-weight:600;font-size:12px;color:var(--muted);text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
th:first-child{border-top-left-radius:10px}th:last-child{border-top-right-radius:10px}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.rowact{white-space:nowrap;text-align:right}
.mut{color:var(--muted)}
.chip{display:inline-block;font-size:12px;border-radius:6px;padding:1px 9px;background:var(--blue-soft);color:var(--primary);font-weight:600}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 12px}
.pill.present,.pill.active,.pill.good{background:var(--green-soft);color:var(--green-ink)}
.pill.late,.pill.pending{background:var(--late-bg);color:var(--late)}
.pill.absent,.pill.inactive{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--blue-soft);color:var(--primary)}

/* ---------- tiles & charts ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:16px}
.tile{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.ti{display:grid;place-items:center;width:46px;height:46px;border-radius:12px;flex:none}
.ti .ic{width:24px;height:24px}
.ti.blue{background:var(--blue-soft);color:var(--primary)}
.ti.green{background:var(--green-soft);color:var(--green-ink)}
.ti.amber{background:var(--late-bg);color:var(--late)}
.ti.red{background:var(--bad-bg);color:var(--bad)}
.tile b{display:block;font-size:26px;line-height:1.1;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile span.l{color:var(--muted);font-size:13px}
.donut{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.donut svg{width:150px;height:150px;flex:none}
.dn{fill:none;stroke-width:14}
.dn.t{stroke:var(--surface-2)}.dn.p{stroke:var(--green)}.dn.l{stroke:var(--amber)}.dn.a{stroke:var(--red)}
.dtxt{font-size:22px;font-weight:700;fill:var(--ink)}
.legend{display:grid;gap:6px;font-size:13px}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.legend b{margin-left:auto;padding-left:14px;font-variant-numeric:tabular-nums}
.i-p{background:var(--green)}.i-l{background:var(--amber)}.i-a{background:var(--red)}
.bars{display:flex;align-items:flex-end;gap:clamp(8px,3vw,28px);height:190px;padding-top:8px}
.bars .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0;gap:4px}
.bars .col b{font-size:13px;font-variant-numeric:tabular-nums}
.bars .col i{display:block;width:min(46px,70%);background:var(--blue);border-radius:6px 6px 0 0;min-height:3px}
.bars .col span{font-size:12px;color:var(--muted);text-align:center}
.line{width:100%;height:auto;display:block}
.line .gl{stroke:var(--line);stroke-width:1}
.line .ax{fill:var(--muted);font-size:10px}
.line .ln{fill:none;stroke:var(--blue);stroke-width:2.5;stroke-linejoin:round}
.line .pt{fill:var(--surface);stroke:var(--blue);stroke-width:2}
.hbar{display:grid;grid-template-columns:130px minmax(0,1fr) 36px;gap:10px;align-items:center;margin:10px 0;font-size:13px}
.hbar .t{height:14px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.hbar .t i{display:block;height:100%;background:var(--blue);border-radius:4px}
.hbar b{text-align:right;font-variant-numeric:tabular-nums}
.rbar{display:inline-block;vertical-align:middle;width:84px;height:8px;border-radius:4px;background:var(--surface-2);margin-right:8px;overflow:hidden}
.rbar i{display:block;height:100%;background:var(--green)}
.rbar.mid i{background:var(--amber)}.rbar.low i{background:var(--red)}

/* ---------- cards ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--shadow)}
.card h3{font-size:17px;line-height:1.25}
.card .who{display:flex;align-items:center;gap:12px;min-width:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:0;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
.card .foot{margin-top:auto;display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.ul{margin:4px 0 0;padding-left:18px}
.mini{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.mini:hover{border-color:var(--blue)}
.mini b{display:block}.mini small{color:var(--muted)}
.minis{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}

/* ---------- training calendar ---------- */
.trg{display:grid;grid-template-columns:minmax(260px,330px) minmax(0,1fr);gap:16px;align-items:start}
.calh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.calg em{font-style:normal;font-size:11px;color:var(--muted);padding:4px 0}
.day{position:relative;aspect-ratio:1;border:0;border-radius:8px;background:none;cursor:pointer;font-weight:500;display:grid;place-items:center}
.day:hover{background:var(--surface-2)}
.day.today{box-shadow:inset 0 0 0 1.5px var(--blue)}
.day.sel{background:var(--primary);color:var(--on-primary)}
.day i{position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--green)}
.day.sel i{background:var(--on-primary)}
.sitem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.sitem:last-child{border-bottom:0}
.sitem h3{font-size:15px}
.sitem .meta{color:var(--muted);font-size:13px}

/* ---------- attendance ---------- */
.stsel{font-weight:600;min-width:112px}
.stsel.present{color:var(--green-ink);background:var(--green-soft)}
.stsel.late{color:var(--late);background:var(--late-bg)}
.stsel.absent{color:var(--bad);background:var(--bad-bg)}
.remark{width:100%}
.sum{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:13px}
.sum span b{font-variant-numeric:tabular-nums}
.saved{border:1px solid var(--green);background:var(--green-soft);border-radius:12px;padding:12px 16px;margin-top:14px;color:var(--green-ink)}
.saved h3{font-size:15px;margin-bottom:4px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 14px;font-weight:600;cursor:pointer;color:var(--muted);margin-bottom:-1px}
.tabs button[aria-pressed="true"]{color:var(--primary);border-color:var(--primary)}
.switch{position:relative;display:inline-block;width:40px;height:22px}
.switch input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .15s}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked+span{background:var(--green)}
.switch input:checked+span::after{transform:translateX(18px)}
.switch input:focus-visible+span{outline:2px solid var(--blue);outline-offset:2px}
.switch input:disabled{cursor:not-allowed}.switch input:disabled+span{opacity:.5}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(8,20,40,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px 16px;overflow-y:auto;z-index:50}
.dlg{background:var(--surface);border:1px solid var(--line);border-radius:14px;width:min(520px,100%);margin-top:6vh;box-shadow:var(--shadow)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.dh h3{font-size:18px}
.x{background:none;border:0;font-size:26px;line-height:1;cursor:pointer;color:var(--muted)}
#mbody{padding:16px 18px;display:grid;gap:12px}
.f{display:grid;gap:4px;font-size:13.5px;min-width:0}
.f>span{color:var(--muted);font-weight:500;display:flex;justify-content:space-between;gap:8px;align-items:center}
.f input,.f select,.f textarea{width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;align-items:center;gap:8px}
.err{color:var(--bad);margin:0 18px 10px;font-weight:500}
.df{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px 16px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:600;z-index:60;box-shadow:var(--shadow)}

@media (max-width:900px){
  .login{grid-template-columns:minmax(0,1fr)}
  .hero{padding:28px 20px}.hero .logo{width:56px;height:56px}.hero .tag{margin-top:4px}
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;padding:10px 12px 6px;gap:6px}
  .nav{flex-direction:row;overflow-x:auto;padding-bottom:6px}
  .nav button{white-space:nowrap;padding:8px 12px}
  .side .note{display:none}
  .grid2,.grid3,.trg{grid-template-columns:minmax(0,1fr)}
  .un{display:none}
  .hbar{grid-template-columns:96px minmax(0,1fr) 30px}
  .row2{grid-template-columns:1fr}
}
</style>

<div id="root"></div>

<div class="overlay" id="ov" hidden>
  <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dt">
    <div class="dh"><h3 id="dt"></h3><button class="x" type="button" data-a="close" aria-label="Close">&times;</button></div>
    <form id="mform" novalidate>

function donut(p,l,a){
  const R=42,C=2*Math.PI*R,tot=p+l+a;
  let off=0,arcs='';
  [[p,'p'],[l,'l'],[a,'a']].forEach(x=>{
    if(!x[0])return;
    const len=x[0]/tot*C;
    arcs+='<circle class="dn '+x[1]+'" cx="60" cy="60" r="'+R+'" stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'" transform="rotate(-90 60 60)"/>';
    off+=len;
  });
  const label=tot?Math.round(p/tot*100)+'%':'–';
  return '<svg viewBox="0 0 120 120" role="img" aria-label="Attendance '+label+'"><circle class="dn t" cx="60" cy="60" r="'+R+'"/>'+arcs+'<text class="dtxt" x="60" y="66" text-anchor="middle">'+label+'</text></svg>';
}

}
function lineChart(points){
  if(!points.length)return '<p class="empty">No attendance recorded yet.</p>';
  const W=520,H=210,L=34,R=12,T=12,B=28,pw=W-L-R,ph=H-T-B;
  const x=i=>L+(points.length===1?pw/2:i*pw/(points.length-1));
  const y=v=>T+ph-(v/100)*ph;
  let g='';
  [0,25,50,75,100].forEach(v=>{g+='<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text class="ax" x="'+(L-6)+'" y="'+(y(v)+3)+'" text-anchor="end">'+v+'%</text>'});
  const pts=points.map((p,i)=>x(i).toFixed(1)+','+y(p.value).toFixed(1)).join(' ');
  const dots=points.map((p,i)=>'<circle class="pt" cx="'+x(i).toFixed(1)+'" cy="'+y(p.value).toFixed(1)+'" r="4"><title>'+esc(p.label)+': '+p.value.toFixed(0)+'%</title></circle><text class="ax" x="'+x(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(p.label)+'</text>').join('');
  return '<svg class="line" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Attendance rate by training day">'+g+'<polyline class="ln" points="'+pts+'"/>'+dots+'</svg>';
}

    const c=cls(s.classId),rec=S.att.some(a=>a.sid===s.id);
    const act=mode==='coach'?'<button class="btn green sm" data-a="take" data-id="'+s.id+'">Take Attendance</button>'+(rec?' '+pill('present','Recorded'):''):'<button class="btn ghost sm" data-a="goto-day" data-id="'+s.date+'">View</button>';
    return '<tr><td><b>'+esc(c.name)+'</b></td><td>'+s.start+' – '+s.end+'</td><td>'+esc(s.field)+'</td><td>'+esc(first(coachOf(c)))+'</td><td>'+classPlayers(c.id,s.date).length+' players</td><td class="rowact">'+act+'</td></tr>';

function dashAdmin(){

function dashCoach(){
  const cs=scopeClasses(),ses=scopeSessions();
  const todays=ses.filter(s=>s.date===TODAY).sort(sortSess);
  const done=ses.filter(s=>S.att.some(a=>a.sid===s.id)).sort((a,b)=>sortSess(b,a)).slice(0,5);
  const rows=done.map(s=>{
    const recs=S.att.filter(a=>a.sid===s.id),pr=recs.filter(a=>a.status==='present').length;
    return '<tr><td>'+fmtDate(s.date)+'</td><td>'+esc(cls(s.classId).name)+'</td><td>'+pr+' / '+recs.length+'</td><td class="num">'+pct(pr/recs.length*100,0)+'</td></tr>';
  }).join('');
  return head('Welcome, Coach '+first(displayName(UI.user)),'Here are your classes and today\'s training sessions.',todayChip())+
  '<section class="panel stack16"><h2>My Classes</h2>'+(cs.length?'<div class="minis">'+cs.map(c=>'<button class="mini" data-a="open-class" data-id="'+c.id+'"><span class="ti blue">'+svg('classes')+'</span><span><b>'+esc(c.name)+'</b><small>'+classPlayers(c.id).length+' players</small></span></button>').join('')+'</div>':'<p class="empty">No classes assigned.</p>')+'</section>'+
  '<section class="panel stack16"><h2>Today\'s Training</h2>'+(todays.length?table(['Class','Time','Field','Coach','Players',''],todayRows(todays,'coach')):'<p class="empty">No training today.</p>')+'</section>'+
  '<section class="panel"><h2>Recent Attendance</h2>'+(rows?table(['Date','Class','Present','Rate'],rows,[3]):'<p class="empty">No attendance recorded yet.</p>')+'</section>';
}
function dashParent(){
  const kids=myChildren();
  const up=[];
  kids.forEach(k=>childSessions(k).filter(s=>s.date>=TODAY).forEach(s=>up.push({s,k})));
  up.sort((a,b)=>sortSess(a.s,b.s));
  const recs=[];
  S.att.forEach(a=>{const k=kids.find(x=>x.id===a.pid);if(k)recs.push({a,k,s:byId(S.sessions,a.sid)})});
  recs.sort((x,y)=>sortSess(y.s,x.s));
  return head('Hello, '+first(displayName(UI.user)),'Here\'s your children\'s information.',todayChip())+
  '<section class="panel stack16"><h2>My Children</h2><div class="cards">'+(kids.length?kids.map(childCard).join(''):'<p class="empty">No children linked to this account yet.</p>')+'</div></section>'+
  '<div class="grid2"><section class="panel"><h2>Upcoming Training</h2>'+(up.length?table(['Date','Child','Class','Time','Field'],up.slice(0,6).map(x=>'<tr><td>'+shortDate(x.s.date)+'</td><td>'+esc(first(x.k.name))+'</td><td>'+esc(cls(x.s.classId).name)+'</td><td>'+x.s.start+'</td><td>'+esc(x.s.field)+'</td></tr>').join('')):'<p class="empty">Nothing scheduled.</p>')+'</section>'+
  '<section class="panel"><h2>Recent Attendance</h2>'+(recs.length?table(['Date','Child','Class','Status'],recs.slice(0,6).map(x=>'<tr><td>'+shortDate(x.s.date)+'</td><td>'+esc(first(x.k.name))+'</td><td>'+esc(cls(x.s.classId).name)+'</td><td>'+pill(x.a.status)+'</td></tr>').join('')):'<p class="empty">No attendance recorded yet.</p>')+'</section></div>';
}
function childCard(p){
  const st=attStats((a,s,pl)=>pl.id===p.id);
  const rc=st.rate==null?'info':(st.rate>=90?'good':(st.rate>=80?'late':'absent'));
  return '<article class="card"><div class="who"><span class="av lg">'+esc(initials(p.name))+'</span><div><h3>'+esc(p.name)+'</h3><span class="mut">'+esc(p.age)+' · '+esc(p.pos)+'</span></div></div><div>'+pill(rc,st.rate==null?'No records':pct(st.rate,0))+' <span class="mut">'+st.present+' / '+st.total+' sessions</span></div><div class="foot"><button class="btn ghost sm" data-a="view-player" data-id="'+p.id+'">View</button></div></article>';
}

/* ---------- training sessions ---------- */
function calendar(ses){
  const parts=UI.calMonth.split('-').map(Number),y=parts[0],m=parts[1];
  const lead=new Date(y,m-1,1).getDay(),days=new Date(y,m,0).getDate();
  let cells='';
  for(let i=0;i<lead;i++)cells+='<span></span>';
  for(let d=1;d<=days;d++){
    const ds=y+'-'+pad(m)+'-'+pad(d),n=ses.filter(s=>s.date===ds).length;
    cells+='<button type="button" class="day'+(ds===TODAY?' today':'')+(ds===UI.calDate?' sel':'')+'" data-a="cal-day" data-id="'+ds+'" aria-label="'+longDate(ds)+(n?', '+n+' session'+(n>1?'s':''):'')+'">'+d+(n?'<i></i>':'')+'</button>';
  }
  return '<div class="calh"><button class="ib" data-a="cal-prev" aria-label="Previous month">&lsaquo;</button><b>'+MONTHS[m-1]+' '+y+'</b><button class="ib" data-a="cal-next" aria-label="Next month">&rsaquo;</button></div><div class="calg">'+['Su','Mo','Tu','We','Th','Fr','Sa'].map(x=>'<em>'+x+'</em>').join('')+cells+'</div>';
}
function pgTraining(){
  const r=role(),ses=scopeSessions(),canEdit=r==='admin'||r==='coach';
  const day=ses.filter(s=>s.date===UI.calDate).sort(sortSess);
  const items=day.map(s=>{
    const c=cls(s.classId),recs=S.att.filter(a=>a.sid===s.id),pr=recs.filter(a=>a.status==='present').length;
    let acts='';
    if(canEdit)acts='<button class="btn green sm" data-a="take" data-id="'+s.id+'">Take Attendance</button>'+ib('edit-session',s.id,'edit','Edit session','edit')+ib('del-session',s.id,'trash','Delete session','del');
    else if(recs.length)acts=pill('present',pr+'/'+recs.length+' present');
    return '<div class="sitem"><div><h3>'+esc(c.name)+'</h3><div class="meta">'+s.start+' – '+s.end+' · '+esc(s.field)+' · Coach '+esc(first(coachOf(c)))+' · '+classPlayers(c.id,s.date).length+' players</div></div><div class="actions">'+acts+'</div></div>';
  }).join('');
  return head(r==='parent'?'Training Schedule':'Training Sessions','Pick a day to see its sessions',canEdit?'<button class="btn" data-a="add-session">+ Create Session</button>':'')+
  '<div class="trg"><section class="panel">'+calendar(ses)+'</section><section class="panel"><h2>'+longDate(UI.calDate)+'</h2>'+(items||'<p class="empty">No sessions on this day.</p>')+'</section></div>';
}

/* ---------- attendance ---------- */
function stSelect(name,st){
  return '<select class="stsel '+st+'" name="'+name+'" aria-label="Status">'+['present','late','absent'].map(v=>'<option value="'+v+'"'+(st===v?' selected':'')+'>'+v.charAt(0).toUpperCase()+v.slice(1)+'</option>').join('')+'</select>';
}
function attRows(s){
  const ps=classPlayers(s.classId,s.date);
  if(!ps.length)return emptyRow(4,'No players registered for this class on this date.');
  return ps.map((p,i)=>{
    const a=getAtt(s.id,p.id),st=a?a.status:'present';
    return '<tr><td class="mut">'+(i+1)+'</td><td><b>'+esc(p.name)+'</b></td><td>'+stSelect('st_'+p.id,st)+'</td><td><input class="remark" name="rm_'+p.id+'" type="text" placeholder="Remark" value="'+esc(a?a.remark:'')+'" aria-label="Remark for '+esc(p.name)+'"></td></tr>';
  }).join('');
}
function pgAttendance(){
  if(role()==='parent')return pgParentAttendance();
  const ses=scopeSessions().sort(sortSess);
  if(!ses.length)return head('Attendance','')+'<p class="empty">No training sessions yet.</p>';
  let s=ses.find(x=>x.id===UI.sid);
  if(!s){s=ses.find(x=>x.date===TODAY)||ses[ses.length-1];UI.sid=s.id}
  const c=cls(s.classId);
  const opt=x=>'<option value="'+x.id+'"'+(x.id===s.id?' selected':'')+'>'+fmtDate(x.date)+' · '+x.start+' · '+esc(cls(x.classId).name)+'</option>';
  const up=ses.filter(x=>x.date>=TODAY),pa=ses.filter(x=>x.date<TODAY).reverse();
  let saved='';
  if(UI.saved===s.id){
    const recs=S.att.filter(a=>a.sid===s.id),pr=recs.filter(a=>a.status==='present').length;
    saved='<div class="saved"><h3>Attendance saved successfully</h3>Present '+pr+' · Late '+recs.filter(a=>a.status==='late').length+' · Absent '+recs.filter(a=>a.status==='absent').length+' · Rate '+pct(recs.length?pr/recs.length*100:null)+'</div>';
  }
  return head('Attendance',c.name+' · '+longDate(s.date)+' · '+s.start+' · '+s.field)+
  '<div class="toolbar"><select id="sidsel" data-f="sid" aria-label="Training session"><optgroup label="Today and upcoming">'+up.map(opt).join('')+'</optgroup><optgroup label="Past">'+pa.map(opt).join('')+'</optgroup></select></div>'+
  '<section class="panel"><form id="attform"><div class="panelhead"><h2>'+esc(c.name)+'</h2><div class="actions"><div class="sum" id="livesum"></div><button class="btn ghost sm" type="button" data-a="mark-all">Mark all present</button></div></div>'+
  '<div class="tablewrap"><table><thead><tr><th>#</th><th>Player</th><th>Status</th><th>Remark</th></tr></thead><tbody>'+attRows(s)+'</tbody></table></div>'+
  '<div class="df" style="padding:14px 0 0"><button class="btn green" type="submit">Save Attendance</button></div>'+saved+'</form></section>';
}
function updateLive(){
  const f=$('#attform');if(!f)return;
  const c={present:0,late:0,absent:0};
  $$('select.stsel',f).forEach(x=>{c[x.value]++;x.className='stsel '+x.value});
  const el=$('#livesum');
  if(el)el.innerHTML='<span><b>'+c.present+'</b> present</span><span><b>'+c.late+'</b> late</span><span><b>'+c.absent+'</b> absent</span>';
}
function pgParentAttendance(){
  const kids=myChildren();
  if(!kids.length)return head('Attendance','')+'<p class="empty">No children linked to this account yet.</p>';
  let k=kids.find(x=>x.id===UI.child);if(!k){k=kids[0];UI.child=k.id}
  const st=attStats((a,s,p)=>p.id===k.id);
  const recs=S.att.filter(a=>a.pid===k.id).map(a=>({a,s:byId(S.sessions,a.sid)})).sort((x,y)=>sortSess(y.s,x.s));
  const rows=recs.map(x=>'<tr><td>'+fmtDate(x.s.date)+'</td><td>'+esc(cls(x.s.classId).name)+'</td><td>'+pill(x.a.status)+'</td><td>'+esc(x.a.remark||'–')+'</td></tr>').join('');
  return head('Attendance',k.name)+
  '<div class="toolbar"><label>Child <select data-f="child" id="childsel">'+kids.map(x=>'<option value="'+x.id+'"'+(x.id===k.id?' selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select></label></div>'+
  '<section class="tiles">'+tile('Attendance rate',pct(st.rate,0),'attendance','green')+tile('Present',st.present,'players','blue')+tile('Late',st.late,'training','amber')+tile('Absent',st.absent,'classes','red')+'</section>'+
  '<section class="panel"><h2>Attendance record</h2>'+table(['Date','Class','Status','Remark'],rows||emptyRow(4,'No attendance recorded yet.'))+'</section>';

/* ---------- reports ---------- */
const repFilter=()=>{const age=UI.f.rage,mon=UI.f.rmon;return (a,s,p)=>(age==='All'||p.age===age)&&(mon==='all'||s.date.indexOf(mon)===0)};
function repAttendance(){
  const flt=repFilter(),st=attStats(flt);
  const rowsP=S.players.filter(p=>UI.f.rage==='All'||p.age===UI.f.rage).map(p=>({p,o:attStats((a,s,pl)=>pl.id===p.id&&flt(a,s,pl))})).filter(x=>x.o.total).sort((a,b)=>a.o.rate-b.o.rate);
  const pr=rowsP.map(x=>'<tr><td><b>'+esc(x.p.name)+'</b></td><td class="num">'+x.o.total+'</td><td class="num">'+x.o.present+'</td><td class="num">'+x.o.absent+'</td><td class="num">'+x.o.late+'</td><td class="num"><span class="rbar '+rateClass(x.o.rate)+'"><i style="width:'+x.o.rate+'%"></i></span>'+pct(x.o.rate,0)+'</td></tr>').join('');
  const sr=S.sessions.slice().sort((a,b)=>sortSess(b,a)).map(s=>{
    const o=attStats((a,ss,p)=>ss.id===s.id&&flt(a,ss,p));

  'add-coach':()=>openModal('Add Coach',parentFields(),{submit:'Save Coach',onSubmit:fd=>saveCoach(fd)}),
  'edit-coach':id=>openModal('Edit Coach',parentFields(byId(S.coaches,id)),{onSubmit:fd=>saveCoach(fd,id)}),
  'view-coach':id=>{
    const k=byId(S.coaches,id),cs=S.classes.filter(c=>c.coachId===id);
    openModal(k.name,'<dl class="kv"><dt>Coach ID</dt><dd>'+esc(k.code)+'</dd><dt>Phone</dt><dd>'+esc(k.phone||'–')+'</dd><dt>Email</dt><dd>'+esc(k.email||'–')+'</dd><dt>Classes</dt><dd>'+(cs.map(c=>esc(c.name)).join('<br>')||'None')+'</dd></dl>',{submit:null});
  },
  'del-coach':id=>{
    const k=byId(S.coaches,id),n=S.classes.filter(c=>c.coachId===id).length;
    if(n){openModal('Cannot Delete Coach','<p style="margin:0"><b>'+esc(k.name)+'</b> still manages '+n+' class'+(n>1?'es':'')+'. Every class needs a coach, so assign another coach to those classes first.</p>',{submit:null});return}
    confirmDelete('Delete Coach','Delete <b>'+esc(k.name)+'</b>?',()=>{S.coaches=S.coaches.filter(c=>c.id!==id);toast('Coach deleted')});
  },
  'add-class':()=>openModal('New Class',classForm(),{submit:'Create Class',onSubmit:fd=>saveClass(fd)}),
  'edit-class':id=>openModal('Edit Class',classForm(cls(id)),{onSubmit:fd=>saveClass(fd,id)}),
  'del-class':id=>{
    const c=cls(id),n=S.regs.filter(r=>r.classId===id).length+S.sessions.filter(s=>s.classId===id).length;
    if(n){openModal('Cannot Delete Class','<p style="margin:0"><b>'+esc(c.name)+'</b> has registrations or training sessions attached. Remove those first.</p>',{submit:null});return}
    confirmDelete('Delete Class','Delete <b>'+esc(c.name)+'</b>?',()=>{S.classes=S.classes.filter(x=>x.id!==id);toast('Class deleted')});
  },
  'open-class':id=>{UI.page='classes';UI.navId='classes';UI.classId=id;render();window.scrollTo(0,0)},
  'back-classes':()=>{UI.classId=null;render()},
  'add-reg':()=>openModal('Register Player',regForm(),{submit:'Register',onSubmit:fd=>saveReg(fd)}),
  'edit-reg':id=>{
    const r=byId(S.regs,id);
    openModal('Edit Registration','<p style="margin:0"><b>'+esc(pname(r.playerId))+'</b> in <b>'+esc(cls(r.classId).name)+'</b></p>'+row2(fld('Registration Date','date',r.date,'date'),sel('Status','status',['Active','Pending','Inactive'],r.status)),{onSubmit:fd=>{
      if(!fd.get('date'))return 'Enter a registration date.';
      r.date=fd.get('date');r.status=fd.get('status');toast('Registration updated');
    }});
  },
  'del-reg':id=>{const r=byId(S.regs,id);confirmDelete('Delete Registration','Remove <b>'+esc(pname(r.playerId))+'</b> from <b>'+esc(cls(r.classId).name)+'</b>?',()=>{S.regs=S.regs.filter(x=>x.id!==id);toast('Registration deleted')})},
  'add-session':()=>openModal('Create Training Session',sessionForm(),{submit:'Create Session',onSubmit:fd=>saveSession(fd)}),
  'edit-session':id=>openModal('Edit Training Session',sessionForm(byId(S.sessions,id)),{onSubmit:fd=>saveSession(fd,id)}),
  'del-session':id=>{const s=byId(S.sessions,id);confirmDelete('Delete Session','Delete the '+esc(cls(s.classId).name)+' session on '+fmtDate(s.date)+'? Its attendance records are removed too.',()=>{S.sessions=S.sessions.filter(x=>x.id!==id);S.att=S.att.filter(a=>a.sid!==id);toast('Session deleted')})},
  'cal-day':d=>{UI.calDate=d;render()},
  'cal-prev':()=>calShift(-1),
  'cal-next':()=>calShift(1),
  'goto-day':d=>{UI.calDate=d;UI.calMonth=d.slice(0,7);go('training')},
  take:id=>{UI.sid=id;UI.saved=null;go('attendance')},
  'mark-all':()=>{$$('#attform select.stsel').forEach(s=>{s.value='present'});updateLive()},
  'rep-tab':id=>{UI.report=id;render()},
  'apply-report':()=>{UI.f.rage=UI.draft.rage;UI.f.rmon=UI.draft.rmon;$('#repbody').innerHTML=repBody();toast('Report generated')},
  'add-acc':()=>openModal('Add Account',accForm(),{submit:'Create Account',onSubmit:fd=>saveAcc(fd)}),
  'edit-acc':id=>openModal('Edit Account',accForm(byId(S.accounts,id)),{onSubmit:fd=>saveAcc(fd,id)}),
  'del-acc':id=>{const a=byId(S.accounts,id);confirmDelete('Delete Account','Delete the account <b>'+esc(a.email)+'</b>? The person it belongs to stays in the academy records.',()=>{S.accounts=S.accounts.filter(x=>x.id!==id);toast('Account deleted')})}
};
function calShift(n){
  const p=UI.calMonth.split('-').map(Number),d=new Date(p[0],p[1]-1+n,1);
  UI.calMonth=d.getFullYear()+'-'+pad(d.getMonth()+1);UI.calDate=UI.calMonth+'-01';render();
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const um=$('#umenu');
  if(um&&!um.hidden&&!e.target.closest('.user'))um.hidden=true;
  const t=e.target.closest('[data-a]');
  if(!t||t.tagName==='INPUT')return;
  const fn=H[t.getAttribute('data-a')];
  if(!fn)return;
  const id=t.getAttribute('data-id');
  fn(id!==null&&/^\d+$/.test(id)?+id:id);
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.getAttribute&&t.getAttribute('data-a')==='toggle-acc'){
    const a=byId(S.accounts,+t.getAttribute('data-id'));
    if(a&&a.id!==UI.user.id){a.active=t.checked;toast(a.active?'Account enabled':'Account disabled')}
  }
});
$('#ov').addEventListener('click',function(e){if(e.target===this)closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#ov').hidden)closeModal()});
$('#mform').addEventListener('submit',function(e){
  e.preventDefault();
  if(!modalCb)return;
  const r=modalCb(new FormData(this));
  if(r===null)return;
  if(typeof r==='string'){modalErr(r);return}
  closeModal();render();
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.closest&&t.closest('#attform')){updateLive();return}
  const f=t.getAttribute&&t.getAttribute('data-f');
  if(!f)return;
  if(f==='sid'){UI.sid=+t.value;UI.saved=null;render();return}
  if(f==='child'){UI.child=+t.value;render();return}
  if(f==='rage'||f==='rmon'){UI.draft[f]=t.value;return}
  UI.f[f]=t.value;
  if(f==='q'||f==='age'||f==='pq')refreshRows();
});
document.addEventListener('submit',e=>{
  const f=e.target;
  if(f.id==='loginform'){
    e.preventDefault();
    const em=(f.email.value||'').trim().toLowerCase(),pw=f.password.value;
    const a=S.accounts.find(x=>x.email.toLowerCase()===em&&x.password===pw);
    const show=m=>{const x=$('#lerr');x.textContent=m;x.hidden=false};
    if(!em||!pw)return show('Enter your email and password.');
    if(!a)return show('Email or password is not correct.');
    if(!a.active)return show('This account is disabled. Ask an Admin to enable it.');
    signIn(a);return;
  }
  if(f.id==='gsearch'){
    e.preventDefault();
    if(allowed('players')){UI.f.q=f.q.value.trim();UI.f.age='All';go(role()==='management'?'players':'players')}
    return;
  }
  if(f.id==='profform'){e.preventDefault();saveProfile(f);return}
  if(f.id==='attform'){
    e.preventDefault();
    const s=byId(S.sessions,UI.sid);
    classPlayers(s.classId,s.date).forEach(p=>{
      const sl=f.querySelector('select[name="st_'+p.id+'"]'),rm=f.querySelector('input[name="rm_'+p.id+'"]');
      setAtt(s.id,p.id,sl?sl.value:'present',rm?rm.value.trim():'');
    });
    UI.saved=s.id;render();toast('Attendance saved successfully');
  }
});

render();
})();
</script>

</body></html>
